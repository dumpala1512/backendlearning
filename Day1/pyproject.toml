[project]
name = "day1"
version = "0.1.0"
description = "Film Review Platform API Skeleton"
readme = "README.md"
authors = [
    { name = "prasad", email = "dumpala1512@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
extraPaths = ["."]
include = ["app"]
