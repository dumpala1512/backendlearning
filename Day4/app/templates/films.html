<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Search</title>
  <!-- HTMX library loaded from CDN -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --badge-bg: #312e81;
      --badge-text: #c7d2fe;
      --rating-gold: #fbbf24;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-family);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .page-title {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .page-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .search-section {
      position: relative;
      margin-bottom: 2.5rem;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 1.25rem;
      color: var(--text-secondary);
      font-size: 1.15rem;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 1rem 3.5rem 1rem 3.25rem;
      font-size: 1.05rem;
      font-family: inherit;
      color: var(--text-primary);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow), 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .search-input::placeholder {
      color: #64748b;
    }

    /* HTMX Spinner Indicator */
    .htmx-indicator {
      display: none;
      position: absolute;
      right: 1.25rem;
      width: 20px;
      height: 20px;
      border: 2px solid #64748b;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Results container */
    #film-results {
      width: 100%;
      min-height: 120px;
    }

    .films-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.5rem;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .film-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .film-card:hover {
      transform: translateY(-2px);
      border-color: #475569;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.25);
    }

    .film-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .film-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .film-genre-badge {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      white-space: nowrap;
    }

    .film-card-body {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .film-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .film-meta-label {
      color: var(--text-secondary);
    }

    .film-meta-value {
      font-weight: 500;
      color: #e2e8f0;
    }

    .rating-badge {
      color: var(--rating-gold);
      font-weight: 600;
    }

    .film-description {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .no-results-state {
      text-align: center;
      padding: 3rem 1.5rem;
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      color: var(--text-secondary);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1 class="page-title">Film Catalogue Search</h1>
      <p class="page-subtitle">Type in a film title to search instantly with server-rendered HTMX</p>
    </header>

    <main>
      <section class="search-section">
        <div class="search-input-wrapper">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input
            id="film-search-input"
            type="search"
            name="q"
            placeholder="Search films by title..."
            hx-get="/ui/films/search"
            hx-trigger="input changed delay:300ms, search"
            hx-target="#film-results"
            hx-swap="innerHTML"
            hx-indicator="#search-indicator"
            class="search-input"
            autocomplete="off"
            aria-label="Search films by title"
          />
          <div id="search-indicator" class="htmx-indicator" aria-label="Loading..."></div>
        </div>
      </section>

      <!-- Empty results container initially displaying no films -->
      <section id="film-results" aria-live="polite">
      </section>
    </main>
  </div>
</body>
</html>
