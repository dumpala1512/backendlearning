[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predeploy-checker"
version = "1.0.0"
description = "Reusable pre-deployment validation gate and readiness checker for Python applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Durgaprasad Dumpala", email = "dumpala1512@gmail.com" }
]
keywords = ["deployment", "predeploy", "validation", "healthcheck", "devops", "ci-cd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
all = [
    "sqlalchemy>=2.0.0",
    "redis>=4.5.0",
    "pytest>=7.0.0",
]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
predeploy-check = "predeploy_checker.cli:main"

[project.urls]
Homepage = "https://github.com/Durgaprasad/predeploy-checker"
Repository = "https://github.com/Durgaprasad/predeploy-checker"

[tool.hatch.build.targets.wheel]
packages = ["src/predeploy_checker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

