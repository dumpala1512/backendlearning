services:
  db:
    image: postgres:16-alpine
    container_name: film-review-db-day4
    restart: unless-stopped
    environment:
      POSTGRES_USER: film_user
      POSTGRES_PASSWORD: film_secret_pass
      POSTGRES_DB: film_review_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_day4:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U film_user -d film_review_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - film-review-net

  redis:
    image: redis:7-alpine
    container_name: film-review-redis-day4
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_day4:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - film-review-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: film-review-platform-day4
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://film_user:film_secret_pass@db:5432/film_review_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TOKEN_SECRET_KEY=film-review-platform-super-secret-signing-key-day4-2026-secure
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CACHE_TTL_SECONDS=300
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - film-review-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: film-review-frontend-day4
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - film-review-net

volumes:
  postgres_data_day4:
    driver: local
  redis_data_day4:
    driver: local

networks:
  film-review-net:
    driver: bridge
