services:
  db:
    image: postgres:16-alpine
    container_name: film-review-db-day4
    restart: unless-stopped
    environment:
      POSTGRES_USER: film_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: film_review_db
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_day4:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U film_user -d film_review_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - film-review-net

  redis:
    image: redis:7-alpine
    container_name: film-review-redis-day4
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_day4:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - film-review-net

  floci-init:
    image: film-review-platform-day4:local
    entrypoint: ["python", "scripts/init_floci.py"]
    command: []
    restart: "no"
    env_file:
      - .env
    environment:
      - AWS_ENDPOINT_URL=http://host.docker.internal:4566
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - film-review-net

  api:
    image: film-review-platform-day4:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: film-review-platform-day4
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - AWS_ENDPOINT_URL=http://host.docker.internal:4566
      - EVENT_QUEUE_URL=http://host.docker.internal:4566/000000000000/film-review-queue
      - EVENT_PUBLISHER_ENABLED=true
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=film_user
      - DB_NAME=film_review_db
      - DB_DRIVER=postgresql+asyncpg
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - film-review-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: film-review-frontend-day4
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - film-review-net

volumes:
  postgres_data_day4:
    driver: local
  redis_data_day4:
    driver: local

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD

networks:
  film-review-net:
    driver: bridge
