[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = ..
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra -q 
markers =
    unit: Fast in-memory unit tests with no external dependencies
    integration: Integration tests requiring database or external services
    database: Database connection required 
    redis: Redis connection required
