[project]
name = "day4"
version = "0.1.0"
description = "Film Review Platform - Day 4: PostgreSQL + SQLAlchemy 2.0 Async Setup"
readme = "README.md"
authors = [
    { name = "prasad", email = "dumpala1512@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.30.0",
    "bcrypt==4.0.1",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "fakeredis>=2.39.0",
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/alembic/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/tests/*",
    "*/scripts/*",
    "*/ui/*",
    "*conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.pyright]
extraPaths = ["."]
include = ["app"]

