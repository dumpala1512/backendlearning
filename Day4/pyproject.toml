[project]
name = "day4"
version = "0.1.0"
description = "Film Review Platform - Day 4: PostgreSQL + SQLAlchemy 2.0 Async Setup"
readme = "README.md"
authors = [
    { name = "prasad", email = "dumpala1512@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extraPaths = ["."]
include = ["app"]
