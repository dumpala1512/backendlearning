[project]
name = "day3"
version = "0.1.0"
description = "Film Review Platform - Day 3: Centralized Configuration & FastAPI Dependency Injection"
readme = "README.md"
authors = [
    { name = "prasad", email = "dumpala1512@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
extraPaths = ["."]
include = ["app"]
